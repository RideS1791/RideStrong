  <circle r="168"/>
 </g>
 <g transform="translate(256 262)" opacity=".2" fill="#fff">
  <g id="t"><rect x="-12" y="-196" width="24" height="34" rx="6"/></g>
  <use href="#t" transform="rotate(30)"/><use href="#t" transform="rotate(60)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(120)"/><use href="#t" transform="rotate(150)"/><use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(210)"/><use href="#t" transform="rotate(240)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(300)"/><use href="#t" transform="rotate(330)"/>
 </g>
